<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영화 티어리스트</title>
<style>
  :root {
    --bg: #0f1221;
    --panel: #1b1f33;
    --panel2: #232842;
    --text: #f2f3f8;
    --muted: #9aa0c0;
    --accent: #6c7bff;
    --s: #ff6b6b;
    --a: #ffb347;
    --b: #74c0fc;
    --c: #9aa0c0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  header {
    padding: 20px 16px;
    text-align: center;
    border-bottom: 1px solid #2c3150;
  }
  header h1 { margin: 0 0 6px; font-size: 22px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }

  .container { max-width: 1000px; margin: 0 auto; padding: 16px; }

  /* 필터 */
  .filters {
    background: var(--panel);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .filter-group { margin-bottom: 10px; }
  .filter-group:last-child { margin-bottom: 0; }
  .filter-group .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid #39406b;
    background: var(--panel2);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); }
  .reset-btn {
    margin-top: 10px;
    background: transparent;
    border: 1px solid #39406b;
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }

  /* 티어 보드 */
  .tier-board { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .tier-row {
    display: flex;
    background: var(--panel);
    border-radius: 12px;
    overflow: hidden;
    min-height: 90px;
  }
  .tier-label {
    width: 70px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: #1a1a1a;
    text-align: center;
    padding: 4px;
  }
  .tier-label.S { background: var(--s); }
  .tier-label.A { background: var(--a); }
  .tier-label.B { background: var(--b); }
  .tier-label.C { background: var(--c); }
  .drop-zone {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px;
    min-height: 90px;
  }
  .drop-zone.drag-over { background: #2a2f4d; }

  /* 영화 목록 */
  .pool-title { font-size: 15px; margin: 18px 0 8px; }
  .pool {
    background: var(--panel);
    border-radius: 12px;
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    min-height: 90px;
  }
  .pool.drag-over { background: #2a2f4d; }

  /* 영화 카드 */
  .movie-card {
    width: 72px;
    background: var(--panel2);
    border-radius: 8px;
    padding: 6px;
    cursor: grab;
    text-align: center;
    user-select: none;
    border: 1px solid #39406b;
  }
  .movie-card:active { cursor: grabbing; }
  .movie-card .poster {
    width: 100%;
    height: 56px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 4px;
  }
  .movie-card .title { font-size: 11px; line-height: 1.3; }
  .movie-card.hidden { display: none; }

  /* 버튼 */
  .actions { display: flex; gap: 8px; margin: 18px 0; flex-wrap: wrap; }
  .btn {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: var(--panel2); color: var(--text); border: 1px solid #39406b; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #2e8b57;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    opacity: 0;
    transition: opacity .3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

  @media (max-width: 500px) {
    .tier-label { width: 52px; font-size: 13px; }
    .movie-card { width: 64px; }
  }
</style>
</head>
<body>
<header>
  <h1>🎬 영화 티어리스트</h1>
  <p>내 취향대로 영화를 드래그해서 등급을 매겨 보세요!</p>
</header>

<div class="container">

  <!-- 필터 -->
  <div class="filters">
    <div class="filter-group">
      <div class="label">관람등급</div>
      <div class="chips" id="ratingChips"></div>
    </div>
    <div class="filter-group">
      <div class="label">장르</div>
      <div class="chips" id="genreChips"></div>
    </div>
    <button class="reset-btn" id="resetFilterBtn">필터 초기화</button>
  </div>

  <!-- 티어 보드 -->
  <div class="tier-board" id="tierBoard">
    <div class="tier-row">
      <div class="tier-label S">명작</div>
      <div class="drop-zone" data-tier="S"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label A">재밌음</div>
      <div class="drop-zone" data-tier="A"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label B">보통</div>
      <div class="drop-zone" data-tier="B"></div>
    </div>
    <div class="tier-row">
      <div class="tier-label C">별로</div>
      <div class="drop-zone" data-tier="C"></div>
    </div>
  </div>

  <!-- 영화 목록 -->
  <div class="pool-title">🎞️ 영화 목록 (여기서 끌어다 놓으세요)</div>
  <div class="pool" id="moviePool" data-tier="pool"></div>

  <!-- 버튼 -->
  <div class="actions">
    <button class="btn btn-primary" id="saveBtn">저장하기</button>
    <button class="btn btn-ghost" id="loadBtn">저장한 내용 불러오기</button>
    <button class="btn btn-ghost" id="clearBtn">전체 초기화</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<footer>외부 서버 없이 동작합니다. 저장 내용은 이 브라우저에만 보관됩니다.</footer>
